name: Deploy

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.1.38
      - run: bun install
      - run: bun run build
      - run: bun run typecheck
      - run: bun run test
      - run: bun publish --access public
        working-directory: packages/haskellish-effect
        env:
          BUN_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - run: bun publish --access public
        working-directory: packages/eslint-plugin-haskellish-effect
        env:
          BUN_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - run: bun publish --access public
        working-directory: packages/haskellish-effect-config
        env:
          BUN_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
