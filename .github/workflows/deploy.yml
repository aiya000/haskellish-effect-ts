name: Deploy

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify tag matches package versions
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          for pkg in packages/haskellish-effect packages/eslint-plugin-haskellish-effect packages/haskellish-effect-config; do
            PKG_VERSION=$(jq -r '.version' "$pkg/package.json")
            if [ "$PKG_VERSION" != "$TAG" ]; then
              echo "Version mismatch in $pkg: tag=$TAG, package.json=$PKG_VERSION"
              exit 1
            fi
          done
          echo "All package versions match tag $TAG"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.1.38
      - run: bun install
      - run: bun run build
      - run: bun run typecheck
      - run: bun run test
      - run: bun publish --access public
        working-directory: packages/haskellish-effect
        env:
          BUN_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - run: bun publish --access public
        working-directory: packages/eslint-plugin-haskellish-effect
        env:
          BUN_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - run: bun publish --access public
        working-directory: packages/haskellish-effect-config
        env:
          BUN_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
